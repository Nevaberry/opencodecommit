[package]
name = "opencodecommit"
version = "1.10.1"
edition = "2024"
rust-version = "1.97"
description = "AI-powered git commit message generator that delegates to terminal AI agents"
license = "MIT"
repository = "https://github.com/Nevaberry/opencodecommit"
keywords = ["git", "commit", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"

[lib]
name = "opencodecommit"
path = "src/lib.rs"

[[bin]]
name = "occ"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"], optional = true }
crossterm = "0.29.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "query", "rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
sha2 = "0.11.0"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dev-dependencies]
expectrl = "0.9.0"
