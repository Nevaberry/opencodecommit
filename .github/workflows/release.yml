name: Production release

on:
  push:
    branches: [production]

permissions:
  contents: write

jobs:
  # ── Tests ──────────────────────────────────────────────────────────
  dependency-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Enforce the 48-hour dependency age rule
        env:
          BASE_REF: ${{ github.event.before }}
        run: node scripts/check-package-age.mjs --base "$BASE_REF" --strict

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  ts-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - working-directory: extension
        run: bun install
      - run: bunx tsc -p extension/tsconfig.json --noEmit
      - run: bun test extension/src/test/inline.test.ts extension/src/test/config.test.ts extension/src/test/api.test.ts
      - run: node --test scripts/check-release.test.mjs

  # ── Cross-compile ─────────────────────────────────────────────────
  cross-compile:
    needs: [dependency-age, rust-test, ts-test]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p opencodecommit
      - name: Copy binary
        shell: bash
        run: |
          EXT=""; [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          cp target/${{ matrix.target }}/release/occ${EXT} npm/opencodecommit/platforms/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: npm/opencodecommit/platforms/${{ matrix.platform }}/occ*

  # ── Publish npm ────────────────────────────────────────────────────
  publish-npm:
    needs: [cross-compile]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: npm/opencodecommit/platforms/
          merge-multiple: false

      - name: Arrange binaries
        run: |
          cd npm/opencodecommit/platforms
          for dir in binary-*; do
            platform="${dir#binary-}"
            cp "$dir"/occ* "$platform"/
            rm -rf "$dir"
          done
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            ls -lh "$p"/occ* || { echo "Missing binary for $p"; exit 1; }
          done
          chmod +x linux-x64/occ linux-arm64/occ darwin-x64/occ darwin-arm64/occ

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check npm primary release
        id: npm-primary
        run: node scripts/check-release.mjs npm

      - name: Publish opencodecommit (primary)
        if: steps.npm-primary.outputs.publish == 'true'
        working-directory: npm/opencodecommit
        run: npm publish --access public

      - name: Check npm alias release
        id: npm-alias
        run: node scripts/check-release.mjs npm-alias

      - name: Publish @nevaberry/opencodecommit (redirect)
        if: steps.npm-alias.outputs.publish == 'true'
        working-directory: npm/nb-opencodecommit
        run: npm publish --access public

  # ── Publish crates.io ─────────────────────────────────────────────
  publish-cargo:
    needs: [dependency-age, rust-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check crates.io release
        id: cargo
        run: node scripts/check-release.mjs cargo
      - name: Publish to crates.io
        if: steps.cargo.outputs.publish == 'true'
        working-directory: crates/opencodecommit
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Publish VS Code extension ─────────────────────────────────────
  publish-extension:
    needs: [dependency-age, ts-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - working-directory: extension
        run: bun install
      - name: Build extension
        working-directory: extension
        run: bun run build:vsix
      - name: Check VS Code Marketplace release
        id: vscode
        run: node scripts/check-release.mjs vscode
      - name: Publish to VS Code Marketplace
        if: steps.vscode.outputs.publish == 'true'
        working-directory: extension
        run: bunx @vscode/vsce publish --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Check Open VSX release
        id: openvsx
        run: node scripts/check-release.mjs openvsx
      - name: Publish to Open VSX
        if: steps.openvsx.outputs.publish == 'true'
        working-directory: extension
        run: bunx ovsx publish --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

  # ── GitHub Release ─────────────────────────────────────────────────
  github-release:
    needs: [cross-compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: artifacts/

      - name: Package release assets
        run: |
          mkdir -p release
          for dir in artifacts/binary-*; do
            platform="${dir#artifacts/binary-}"
            cd "$dir"
            if ls occ.exe 2>/dev/null; then
              zip "../../release/occ-${platform}.zip" occ.exe
            else
              chmod +x occ
              tar czf "../../release/occ-${platform}.tar.gz" occ
            fi
            cd ../..
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release/*
